name: payroll-workflow
version: 1.0.0
description: Blockchain payroll workflow with ERC20 token transfers

# Configuration
config:
  tokenAddress: "0xD2C2f3FAA1517582a37652c6B1BFCFF147CbA626"
  chainSelector: 40875

# Triggers
triggers:
  - id: payroll-http
    type: http-trigger@1.0.0-alpha
    config: {}

# Actions
actions:
  # Parse and validate input
  - id: parse-input
    type: script@1.0.0
    config:
      code: |
        const input = JSON.parse(trigger.input);
        if (!input.batchId || !input.records || input.records.length === 0) {
          throw new Error("Invalid input: missing batchId or records");
        }
        return input;

  # Risk & compliance gate (allowlist + maxAmount). Blocks non-compliant records from execution.
  - id: risk-check
    type: script@1.0.0
    config:
      code: |
        const input = parse_input.output;
        const registry = (config && Array.isArray(config.authorizedEmployees))
          ? config.authorizedEmployees
          : [];
        
        if (registry.length === 0) {
          throw new Error("Compliance config missing: config.authorizedEmployees must be provided");
        }
        
        const approvedRecords = [];
        const violations = [];
        
        for (const r of input.records) {
          const wallet = String(r.employeeId || "").toLowerCase();
          const amount = Number(r.amount || 0);
          const emp = registry.find(e => String(e.wallet || "").toLowerCase() === wallet);
        
          if (!emp) {
            violations.push({
              employeeId: r.employeeId,
              amount,
              reason: "UNAUTHORIZED_EMPLOYEE"
            });
            continue;
          }
        
          if (amount > Number(emp.maxAmount)) {
            violations.push({
              employeeId: r.employeeId,
              amount,
              reason: "AMOUNT_EXCEEDS_LIMIT",
              employeeName: emp.name,
              department: emp.department,
              maxAllowed: emp.maxAmount
            });
            continue;
          }
        
          approvedRecords.push({ employeeId: r.employeeId, amount });
        }
        
        return {
          batchId: input.batchId,
          approvedRecords,
          violations,
          summary: {
            requested: input.records.length,
            approved: approvedRecords.length,
            rejected: violations.length
          }
        };

  # Execute transfers for each employee
  - id: execute-transfers
    type: for-each@1.0.0
    config:
      items: ${risk-check.output.approvedRecords}
      action:
        type: evm-contract-call@1.0.0
        config:
          chain: evm:ChainSelector:40875@1.0.0
          contract: "0xD2C2f3FAA1517582a37652c6B1BFCFF147CbA626"
          method: "transfer"
          abi: |
            [
              {
                "inputs": [
                  {"name": "to", "type": "address"},
                  {"name": "amount", "type": "uint256"}
                ],
                "name": "transfer",
                "outputs": [{"name": "", "type": "bool"}],
                "stateMutability": "nonpayable",
                "type": "function"
              }
            ]
          args:
            - ${item.employeeId}
            - ${item.amount * 1000000000000000000}  # Convert to wei (18 decimals)

  # Format results
  - id: format-results
    type: script@1.0.0
    config:
      code: |
        const input = parse_input.output;
        const compliance = risk_check.output;
        const transfers = execute_transfers.output;
        
        const payouts = transfers.map((tx, index) => ({
          employee: compliance.approvedRecords[index].employeeId,
          amount: compliance.approvedRecords[index].amount,
          txHash: tx.hash,
          status: tx.success ? "success" : "failed"
        }));
        
        const successCount = payouts.filter(p => p.status === "success").length;
        const totalAmount = payouts
          .filter(p => p.status === "success")
          .reduce((sum, p) => sum + p.amount, 0);
        
        return {
          batchId: input.batchId,
          compliance: {
            ...compliance.summary,
            violations: compliance.violations
          },
          result: compliance.violations.length > 0
            ? `COMPLIANCE BLOCKED: Batch ${input.batchId}: ${compliance.summary.approved}/${compliance.summary.requested} approved, ${compliance.summary.rejected} rejected. Transfers executed for approved only.`
            : `Processed batch ${input.batchId}: ${successCount}/${payouts.length} successful transfers, Total: ${totalAmount} SCLO`,
          payouts
        };

# Workflow definition
workflows:
  - name: main
    steps:
      - trigger: payroll-http
      - action: parse-input
      - action: risk-check
      - action: execute-transfers
      - action: format-results

# Environment-specific settings
staging-settings:
  user-workflow:
    workflow-name: payroll-workflow-staging
  workflow-artifacts:
    workflow-path: "."
    config-path: "./config.staging.json"
    secrets-path: ""
  rpcs:
    - chain-name: ethereum-testnet-sepolia
      url: https://ethereum-sepolia-rpc.publicnode.com
  experimental-chains:
    - chain-selector: 40875
      rpc-url: "https://hoodi.gateway.tenderly.co/4fDA7Gwm1ysQLJfnh43We1"
      forwarder: "0x0000000000000000000000000000000000000000"

production-settings:
  user-workflow:
    workflow-name: payroll-workflow-production
  workflow-artifacts:
    workflow-path: "."
    config-path: "./config.production.json"
    secrets-path: ""
